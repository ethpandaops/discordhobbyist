name: goreleaser

on:
  push:
    tags:
      - '*'

jobs:
  goreleaser:
    permissions:
      contents: write      # GitHub release
      packages: write      # push to ghcr.io/ethpandaops
      id-token: write      # attest, and authenticate to the image mirror
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.attest.outputs.image }}
      digests: ${{ steps.attest.outputs.digests }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@6edd4406fa81c3da01a34fa6f6343087c207a568 # v3.5.0
      -
        name: Set up NodeJS
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v3.8.2
        with:
          node-version: 18
      -
        name: Login to GHCR
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@b508e2e3ef3b19d4e4146d4f8fb3ba9db644a757 # v3.2.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Attest images
        id: attest
        uses: ethpandaops/actions/mirror-image@62e1509a4fcb59de57d51c05f1e2843f2439fa99
        with:
          goreleaser-artifacts: dist/artifacts.json
          mirror: "false"

  # Separate job, so "Re-run failed jobs" retries only the mirror and never
  # rebuilds the images.
  mirror:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write      # authenticate to the image mirror
    steps:
      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@62e1509a4fcb59de57d51c05f1e2843f2439fa99
        with:
          image: ${{ needs.goreleaser.outputs.image }}
          tags: ${{ needs.goreleaser.outputs.digests }}
          attest: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
